name: Endpoint heartbeat

on:
  workflow_call:
    inputs:
      config_path:
        description: Path to the heartbeat configuration in the caller repository.
        required: false
        type: string
        default: Examples/heartbeat.json
      source_ref:
        description: Endpoint Heartbeat revision to run.
        required: false
        type: string
        default: main
      report_title:
        description: Title written into the heartbeat report.
        required: false
        type: string
  workflow_dispatch:
  schedule:
    - cron: "45 * * * *"

permissions:
  contents: read

jobs:
  heartbeat:
    runs-on: macos-latest
    timeout-minutes: 5
    env:
      CONFIG_PATH: ${{ inputs.config_path || 'Examples/heartbeat.json' }}
      SOURCE_REF: ${{ inputs.source_ref || 'main' }}
      REPORT_TITLE: ${{ inputs.report_title || github.workflow }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: robinphillips/EndpointHeartbeat
          ref: ${{ env.SOURCE_REF }}
          path: .endpoint-heartbeat
      - name: Set report filenames
        run: |
          report_timestamp=$(date -u +%Y%m%dT%H%M%SZ)
          echo "REPORT_JSON=heartbeat-report-${report_timestamp}.json" >> "$GITHUB_ENV"
          echo "REPORT_MARKDOWN=heartbeat-report-${report_timestamp}.md" >> "$GITHUB_ENV"
      - name: Check endpoints
        run: >-
          swift run --package-path .endpoint-heartbeat -c release endpoint-heartbeat check --config "$CONFIG_PATH"
          --title "$REPORT_TITLE" --report "$REPORT_JSON" --markdown-report "$REPORT_MARKDOWN"
      - name: Add report to job summary
        if: always()
        run: cat "$REPORT_MARKDOWN" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload heartbeat report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: heartbeat-report
          path: heartbeat-report-*.json
          if-no-files-found: error
          retention-days: 90
