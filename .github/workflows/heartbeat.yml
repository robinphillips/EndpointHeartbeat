name: Endpoint heartbeat

on:
  workflow_dispatch:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"

permissions:
  contents: read

jobs:
  heartbeat:
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Check endpoints
        run: swift run -c release endpoint-heartbeat check --config Examples/heartbeat.json
