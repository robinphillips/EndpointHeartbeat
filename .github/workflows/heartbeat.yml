name: Endpoint heartbeat

on:
  workflow_call:
    inputs:
      config_path:
        description: Path to the heartbeat configuration in the caller repository.
        required: false
        type: string
        default: Examples/heartbeat.json
      source_ref:
        description: Endpoint Heartbeat revision to run.
        required: false
        type: string
        default: main
  workflow_dispatch:
  schedule:
    - cron: "45 * * * *"

permissions:
  contents: read

jobs:
  heartbeat:
    runs-on: macos-latest
    timeout-minutes: 5
    env:
      CONFIG_PATH: ${{ inputs.config_path || 'Examples/heartbeat.json' }}
      SOURCE_REF: ${{ inputs.source_ref || 'main' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: robinphillips/EndpointHeartbeat
          ref: ${{ env.SOURCE_REF }}
          path: .endpoint-heartbeat
      - name: Check endpoints
        run: >-
          swift run --package-path .endpoint-heartbeat -c release endpoint-heartbeat check --config "$CONFIG_PATH"
          --report heartbeat-report.json --markdown-report heartbeat-report.md
      - name: Add report to job summary
        if: always()
        run: cat heartbeat-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload heartbeat report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: heartbeat-report
          path: heartbeat-report.json
          if-no-files-found: error
          retention-days: 90
